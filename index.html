function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fD(d){return ES_UI?d.getDate()+" "+MS[d.getMonth()]+" "+d.getFullYear():d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function aD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}

  return t("e_lead_range",fD(minCheckInDate()),fD(maxCheckInDate()));

}

function seasonYear(iso){var d=pd(iso);return d.getMonth()>=10?d.getFullYear():d.getFullYear()-1}
function pickSeason(){
  // Nov-Dec: the season starting that November. Jan-Apr: the one that started the
  // previous November. May-Oct: the next one. If the backend has not sent that
  // season yet, show the nearest one it has, with years, so no date is ambiguous.
  var want=S.vM>=10?S.vY:(S.vM<=3?S.vY-1:S.vY),have={};
  HIGH_SEASON.concat(MID_SEASON).forEach(function(s){have[seasonYear(s.start)]=true});
  var ys=Object.keys(have).map(Number);if(!ys.length)return null;
  if(have[want])return{y:want,exact:true};
  ys.sort(function(a,b){return Math.abs(a-want)-Math.abs(b-want)||b-a});
  return{y:ys[0],exact:false};
}
function mdy(d){return MS[d.getMonth()]+NB+d.getDate()}
function fmtRange(s,e,withYear){

    ?mdy(s)+"–"+e.getDate()
    :mdy(s)+NB+"–"+NB+mdy(e);
  return withYear?t+","+NB+e.getFullYear():t;
}
function eventName(label){
  if(ES_UI&&hsKey(label))return hsLabel(label);
  var l=String(label||"").toLowerCase();
  if(/ondalinda/.test(l))return"Ondalinda";
  if(/christmas|navidad/.test(l))return"Christmas & New Year";
  if(/chinese|chino/.test(l))return"Chinese New Year";
  if(/easter|holy|santa/.test(l))return"Easter";
  return String(label||"").trim();
}
function seasonText(){
  var p=pickSeason();if(!p)return null;
  var inY=function(s){return seasonYear(s.start)===p.y};
  var hs=HIGH_SEASON.filter(inY).sort(function(a,b){return pd(a.start)-pd(b.start)});
  var ms=MID_SEASON.filter(inY),all=hs.concat(ms);
  var st=null,en=null;
  all.forEach(function(s){var a=pd(s.start),b=pd(s.end);if(!st||a<st)st=a;if(!en||b>en)en=b});
  var out={high:hs.map(function(s){return eH(eventName(s.label))+" (<b class=\"nw\">"+fmtRange(pd(s.start),pd(s.end),!p.exact)+"</b>)"}).join(" · ")};
  if(ms.length){
    out.mid=t("mid_every",'<b class="nw">'+mdy(st),mdy(en)+(p.exact?"":","+NB+en.getFullYear())+"</b>");
    out.low="<b class=\"nw\">"+mdy(aD(en,1))+NB+"–"+NB+mdy(aD(st,-1))+"</b>";
  }
  return out;
}

function gS(ci,co){var d=new Date(ci),h=0,m=0,l=0;while(d<co){gH(d)?h++:(gM(d)?m++:l++);d=aD(d,1)}return h>=m&&h>=l?"high":(m>=l?"mid":"low")}
function cDays(y,m){var f=new Date(y,m,1),last=new Date(y,m+1,0).getDate();var dow=f.getDay();if(dow===0)dow=7;var days=[];for(var i=1;i<dow;i++)days.push(null);for(var d=1;d<=last;d++)days.push(new Date(y,m,d));return days}

    html+='<div class="ect">'+t("tr_head")+'</div>';
    TRANSPORT.forEach(function(item){
      var on=!!S.tr[item.id],q=S.tr[item.id]||1;
      var qH="";
      if(on){
        qH='<div class="qr"><button class="qb" onclick="event.stopPropagation();sQ(\''+item.id+'\','+(q-1)+')">−</button>'
          +'<span class="qv">'+q+'</span>'
          +'<button class="qb" onclick="event.stopPropagation();sQ(\''+item.id+'\','+(q+1)+')">+</button>'
          +'<span class="qt">'+f$(item.pr*q)+' USD</span></div>';
      }
      html+='<div class="er'+(on?" on":"")+'" onclick="tT(\''+item.id+'\')">'
        +'<div class="eck"><div class="cbx'+(on?" on":"")+'">'+(on?"✓":"")+'</div>'
        +'<div class="ei"><div class="en">'+item.nm+'</div><div class="ed">'+item.ds+'</div></div>'
        +'<div class="ep2">'+f$(item.pr)+' USD</div></div>'+qH+'</div>';
    });
    if(tTot()>0)html+='<div class="etb"><span style="font-size:13px;color:#888">'+t("tr_subtotal")+'</span><span style="font-size:16px;font-weight:700;color:#E8863A">'+f$(tTot())+' USD</span></div>';
    html+='<p style="font-size:12px;color:#aaa;margin-top:8px;text-align:center">'+t("tr_after")+'</p>';
  }

  /* ═══ STEP 2: CONTACT ═══ */
  if(S.step===2){
    var b=getNB(),segs=[];
    if(b.high>0)segs.push(["high",b.high,RATE_H]);
    if(b.mid>0)segs.push(["mid",b.mid,RATE_M]);
    if(b.low>0)segs.push(["low",b.low,RATE_L]);
    var acL="";
    if(segs.length>1){
      acL=segs.map(function(s){return '<div class="sr"><span class="sk">'+t("sm_mixed",s[1],nW(s[1]),t(ES_UI?"sl_"+s[0]:"s_"+s[0]),f$(s[2]))+'</span><span class="sv">'+f$(s[1]*s[2])+'</span></div>'}).join("");
    }else{
      acL='<div class="sr"><span class="sk">'+t("sm_accom",ES_UI?t("ss_"+(segs.length?segs[0][0]:"low")).toLowerCase():t("ss_"+(segs.length?segs[0][0]:"low")))+'</span><span class="sv">'+f$(rTot())+'</span></div>';
    }
    var petL=petTot()>0?'<div class="sr"><span class="sk">'+t("sm_pets",S.pets,nts(),nW(nts()))+'</span><span class="sv">'+f$(petTot())+'</span></div>':'';
    var trL="";
    TRANSPORT.forEach(function(i){if(S.tr[i.id]){var q=S.tr[i.id]||1;trL+='<div class="sr"><span class="sk">'+i.nm+(q>1?" ×"+q:"")+'</span><span class="sv">'+f$(i.pr*q)+'</span></div>'}});

    html+='<h2 class="eh2">'+t("ct_title")+'</h2><p class="esub">'+t("ct_sub")+'</p>'
      +'<div class="fld"><label class="lbl" for="contactName">'+t("ct_name")+'</label><input id="contactName" value="'+eH(S.name)+'" oninput="S.name=this.value;syncPayButton()" placeholder="'+t("ct_name_ph")+'" autocomplete="name"></div>'
      +'<div class="fld"><label class="lbl" for="contactEmail">'+t("ct_email")+'</label><input id="contactEmail" value="'+eH(S.email)+'" oninput="S.email=this.value;syncPayButton()" placeholder="'+t("ct_email_ph")+'" type="email" autocomplete="email" inputmode="email"></div>'
      +'<div class="fld"><label class="lbl" for="contactPhone">'+t("ct_phone")+'</label><input id="contactPhone" value="'+eH(S.phone)+'" oninput="S.phone=this.value;syncPayButton()" placeholder="'+t("ct_phone_ph")+'" type="tel" autocomplete="tel" inputmode="tel"></div>'
      +'<div class="fld"><label class="lbl" for="contactNotes">'+t("ct_notes")+'</label><textarea id="contactNotes" oninput="S.notes=this.value" placeholder="'+t("ct_notes_ph")+'">'+eH(S.notes)+'</textarea></div>'
      +'<div class="sbox"><div class="slbl">'+t("sm_head")+'</div>'
      +'<div class="sr"><span class="sk">'+fD(S.ci)+' — '+fD(S.co)+'</span><span class="sv">'+nts()+' '+nW(nts(),true)+' · '+S.guests+' '+t(S.guests>1?"guests":"guest")+'</span></div>'
      +acL+trL+petL
      +'<div class="sr tot"><span class="sk">'+t("sm_total")+'</span><span class="sv">'+f$(gTot())+' USD</span></div></div>'
      +(S.err?'<div class="err" role="alert">'+eH(S.err)+'</div>':'')
      +'<label class="agree"><input type="checkbox" id="agreeBox"'+(S.agreed?' checked':'')+' onchange="S.agreed=this.checked;syncPayButton()"><span>'+t("agree",'<a href="'+AGREEMENT_URL+'" target="_blank" rel="noopener">'+t("agree_link")+'</a>')+' <span class="req">*</span></span></label>'
      +'<div class="stripe-badge">'+t("stripe")+'</div>';
  }

  /* ═══ NAVIGATION ═══ */
  if(S.bootFail&&S.step===0)html+='<div class="calm" role="status">'+MSG.live+'</div>';
  if(S.paySlow&&S.sending&&S.step===2)html+='<div class="calm" role="status">'+MSG.slow+'</div>';
  if(S.payFail&&S.step===2)html+='<div class="calm" role="status">'+MSG.pay+'</div>';
  html+='<div class="nav">';
  if(S.step>0)html+='<button class="bs" onclick="goB()">'+t("b_back")+'</button>';
  html+='<div class="spacer"></div>';
  if(S.step===0&&S.bootFail){html+='<button class="bp" onclick="retryBoot()">'+MSG.again+'</button>'}
  else if(S.step===0){var can=S.ci&&S.co&&!S.stale;html+='<button class="bp'+(can?"":" dim")+'" onclick="goN()"'+(can?"":" disabled") +'>'+(S.ci&&S.co&&S.stale?t("b_checking"):t("b_next"))+'</button>'}
  if(S.step===1)html+='<button class="bp" onclick="goN()">'+t("b_next")+'</button>';
  if(S.step===2){var can2=contactReady();html+='<button id="payBtn" class="bp'+(can2&&!S.sending?"":" dim")+'" onclick="pay()"'+(can2&&!S.sending?"":" disabled")+'>'+(S.sending?t("b_processing"):S.payFail?MSG.again+" →":t("b_pay",f$(gTot())))+'</button>'}
  html+='</div>';
  if((S.bootFail&&S.step===0)||(S.payFail&&S.step===2))html+='<p class="help">'+MSG.help+'</p>';

  app.innerHTML=html;
}

window.R=R;

function contactReady(){
  var nameOk=!!S.name.trim();
  var phoneOk=!!S.phone.trim();
  var emailOk=!!S.email.trim();

  var emailInput=document.getElementById("contactEmail");
  if(emailInput)emailOk=emailOk&&emailInput.checkValidity();
  else emailOk=emailOk&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim());

  return nameOk&&emailOk&&phoneOk&&S.agreed===true;
}
function emailValid(){
  if(!S.email.trim())return false;
  var el=document.getElementById("contactEmail");
  if(el)return el.checkValidity();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim());
}


window.syncPayButton=function(){
  var btn=document.getElementById("payBtn");
  if(!btn)return;

  var ready=contactReady()&&!S.sending;
  btn.disabled=!ready;
  btn.classList.toggle("dim",!ready);
};

/* ═══ HANDLERS ═══ */
window.pM=function(){if(S.vM===0){S.vM=11;S.vY--}else S.vM--;R()};
window.nM=function(){if(S.vM===11){S.vM=0;S.vY++}else S.vM++;R()};

window.hDay=function(ts){
  var date=new Date(ts);
  if(iB(date)||date<todayC)return;
  S.err="";

  if(S.sel==="in"||(S.ci&&S.co)){
    if(!checkInWithinLeadWindow(date)){S.err=leadWindowMessage();R();return}
    S.ci=date;S.co=null;S.sel="out";
  }
  else{
    if(date<=S.ci){
      if(!checkInWithinLeadWindow(date)){S.err=leadWindowMessage();R();return}
      S.ci=date;S.co=null;S.sel="out";R();return;
    }
    if(hB(S.ci,date)){S.err=t("e_overlap");R();return}
    var n=df(S.ci,date),se=gS(S.ci,date),min=se==="high"?MIN_H:(se==="mid"?MIN_M:MIN_L);
    if(n<min){S.err=t("e_min",min,nW(min),t("sl_"+se));R();return}
    S.co=date;S.sel="in";
    R();revealContinue();return;
  }
  R();
};

/* Phone fix (MSWIPE21). After the check-out date is picked, bring the Continue
   button into view so guests don't have to swipe for it. Touch screens only.
   Waits for the host page to grow the frame, then (a) asks the host page to
   scroll (message cp-widget:reveal, used once the site listens for it) and
   (b) calls scrollIntoView, which most phone browsers pass up to the page. */
function revealContinue(){
  try{if(!(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches))return}catch(e){return}
  setTimeout(function(){
    var b=document.querySelector(".nav .bp");
    if(!b||S.step!==0||!(S.ci&&S.co))return;
    var r=b.getBoundingClientRect(),y=window.pageYOffset||0;
    try{if(window.parent!==window)window.parent.postMessage({type:"cp-widget:reveal",top:Math.round(r.top+y),bottom:Math.round(r.bottom+y)},"*")}catch(e){}
    try{b.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){try{b.scrollIntoView(false)}catch(e2){}}
  },350);
}

window.tT=function(id){if(S.tr[id])delete S.tr[id];else S.tr[id]=1;R()};
window.sQ=function(id,q){if(q<1)delete S.tr[id];else S.tr[id]=q;R()};
window.goB=function(){S.step--;S.err="";S.payFail=false;R()};
window.goN=function(){
  if(S.step===0&&S.stale)return;
  if(S.step===0&&!(S.ci&&S.co)){S.err=t("e_dates");R();return}
  S.step++;S.err="";R();
};

/* Fetches a reCAPTCHA token, then hands it to cb. Any problem — no key, script
   blocked, Google slow — calls back with "" so a real guest is never stuck; the
   backend decides what an empty token means. */
function withRecaptcha(cb){
  if(!RECAPTCHA_SITE_KEY||!window.grecaptcha||!window.grecaptcha.execute){cb("");return}
  var done=false,finish=function(tk){if(done)return;done=true;cb(tk||"")};
  setTimeout(function(){finish("")},6000);
  try{
    grecaptcha.ready(function(){
      grecaptcha.execute(RECAPTCHA_SITE_KEY,{action:"checkout"})
        .then(function(tk){finish(tk)},function(){finish("")});
    });
  }catch(e){finish("")}
}

window.pay=function(){
  if(!contactReady()){
    S.err=!S.name.trim()||!S.email.trim()||!S.phone.trim()
      ?t("e_fill")
      :!emailValid()
      ?t("e_email")
      :t("e_tick");
    R();return
  }
  if(S.sending)return;
  S.sending=true;S.err="";S.payFail=false;S.paySlow=false;R();

  var transportData=[];
  TRANSPORT.forEach(function(i){
    if(S.tr[i.id])transportData.push({id:i.id,qty:String(S.tr[i.id]||1)});
  });

  var payload={
    action:"create_checkout",
    lang:LANG,
    checkIn:fd(S.ci),
    checkOut:fd(S.co),
    guests:String(S.guests),
    pets:String(S.pets),

    // These are NOT trusted for pricing. The backend only compares them
    // with the current Sheet values to detect a stale browser session.
    displayedRateLow:String(RATE_L),
    displayedRateMid:String(RATE_M),
    displayedRateHigh:String(RATE_H),

    transport:transportData,
    name:S.name,
    email:S.email,
    phone:S.phone,
    notes:S.notes,
    agreementAccepted:S.agreed===true,
    acceptedAt:new Date().toISOString()
  };

  withRecaptcha(function(rcToken){
    payload.recaptchaToken=rcToken;

    var ac=window.AbortController?new AbortController():null;
    var tNote=setTimeout(function(){S.paySlow=true;R()},PAY_NOTE_MS);
    var tStop=ac?setTimeout(function(){ac.abort()},PAY_STOP_MS):0;
    var stopTimers=function(){clearTimeout(tNote);clearTimeout(tStop);S.paySlow=false};
    var opts={method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)};
    if(ac)opts.signal=ac.signal;

    fetch(API_URL,opts)
    .then(function(r){return r.json()})
    .then(function(data){
      stopTimers();
      if(data.success&&data.url){
        /* GATRACK21: tell the website the guest is going to Stripe (it records
           "begin_checkout" in Google Analytics). casapapelillo.com only, no data.
           Short pause so the site can send it before this page is left. */
        var stripeUrl=data.url,sent=false;
        try{if(window.parent!==window){window.parent.postMessage({type:"cp-widget:checkout"},"https://casapapelillo.com");sent=true}}catch(e){}
        setTimeout(function(){window.top.location.href=stripeUrl},sent?250:0);
      }else{
        S.err=(data&&data.code==="RATES_CHANGED")
          ?t("e_rates")
          :(data&&data.code==="RECAPTCHA_FAILED")
          ?t("e_verify")
          :beMsg(data&&data.message)||t("e_start");
        S.sending=false;R();
      }
    })
    .catch(function(e){
      stopTimers();
      console.error("Checkout call failed: "+String(e&&e.message||e));
      S.payFail=true;S.sending=false;R();
    });
  });
};
/* Speed (MSWIPE21b). The Apps Script call takes 1.7-3 s. The last answer is kept
   in this browser (24 h) so the calendar shows at once while the live answer loads;
   Continue waits for the live answer. A hidden copy of this page opened with
   ?prefetch=1 (by the website, after the page loads) only fetches and stores it.
   Prices are never trusted from the browser: the backend reprices at checkout. */
var BOOT_KEY="cp_boot_v1_"+(IS_DEV?"dev":"live"),BOOT_MAX_MS=24*3600*1000;
function bootGet(){try{var o=JSON.parse(localStorage.getItem(BOOT_KEY)||"null");if(o&&o.cfg&&Date.now()-o.t<BOOT_MAX_MS)return o.cfg}catch(e){}return null}
function bootPut(cfg){try{localStorage.setItem(BOOT_KEY,JSON.stringify({t:Date.now(),cfg:cfg}))}catch(e){}}
function fetchBootOnce(limitMs){
  var c=window.AbortController?new AbortController():null;
  var t=c?setTimeout(function(){c.abort()},limitMs):0;
  return fetch(API_URL+"?action=bootstrap",c?{signal:c.signal}:{}).then(function(r){
    if(!r.ok)throw new Error("Config request failed");
    return r.json();
  }).then(function(cfg){clearTimeout(t);return cfg},function(e){clearTimeout(t);throw e});
}
function fetchBoot(){
  return fetchBootOnce(BOOT_STOP_MS).catch(function(){return fetchBootOnce(BOOT_RETRY_MS)});
}
window.retryBoot=function(){S.bootFail=false;S.stale=true;R();loadBookingData()};
function applyCfg(cfg){
  var dates=cfg.blocked;

  if(!cfg||cfg.success!==true){
    throw new Error((cfg&&cfg.message)||"Invalid config response");
  }

  if(cfg.stripeMode!==EXPECTED_STRIPE_MODE){
    throw new Error(
      "Safety check failed: expected Stripe "+EXPECTED_STRIPE_MODE+
      " mode but backend reported "+String(cfg.stripeMode)+"."
    );
  }

  RATE_L=Number(cfg.rates.low);
  RATE_M=Number(cfg.rates.mid!=null?cfg.rates.mid:cfg.rates.low);
  RATE_H=Number(cfg.rates.high);
  MIN_L=Number(cfg.minimumNights.low);
  MIN_M=Number(cfg.minimumNights.mid!=null?cfg.minimumNights.mid:cfg.minimumNights.low);
  MIN_H=Number(cfg.minimumNights.high);
  MIN_LEAD_DAYS=Number(cfg.minLeadDays);
  MAX_LEAD_DAYS=Number(cfg.maxLeadDays);
  MAX_PETS=Number(cfg.maxPets)||0;
  PET_RATE=Number(cfg.petRate)||0;

  if(!Number.isInteger(MIN_LEAD_DAYS)||MIN_LEAD_DAYS<0){
    throw new Error("Invalid MIN_LEAD_DAYS from backend.");
  }
  if(!Number.isInteger(MAX_LEAD_DAYS)||MAX_LEAD_DAYS<MIN_LEAD_DAYS){
    throw new Error("Invalid MAX_LEAD_DAYS from backend.");
  }

  HIGH_SEASON=Array.isArray(cfg.highSeasons)?cfg.highSeasons:[];
  MID_SEASON=Array.isArray(cfg.midSeasons)?cfg.midSeasons:[];

  TRANSPORT=(Array.isArray(cfg.transportation)?cfg.transportation:[]).map(function(i){
    return {
      id:i.id,
      nm:trText(i.id,"nm",i.name),
      ds:trText(i.id,"ds",i.desc),
      pr:Number(i.price)
    };
  });

  BOOKED=Array.isArray(dates)?dates:[];
}
/* After live data arrives, drop a selection that is no longer valid. */
function recheckSelection(){
  if(!S.ci)return;
  var bad=iB(S.ci)||S.ci<todayC;
  if(!bad&&S.co){
    var n=df(S.ci,S.co),se=gS(S.ci,S.co),min=se==="high"?MIN_H:(se==="mid"?MIN_M:MIN_L);
    bad=hB(S.ci,S.co)||n<min;
  }
  if(bad){S.ci=null;S.co=null;S.sel="in";S.err=t("e_avail")}
}
function loadBookingData(){
  var cached=bootGet();
  if(cached){try{applyCfg(cached);S.stale=true;R()}catch(e){cached=null;S.stale=false}}
  fetchBoot().then(function(cfg){
    applyCfg(cfg);bootPut(cfg);S.stale=false;S.bootFail=false;recheckSelection();R();
  })
  .catch(function(err){
    console.error("Availability call failed: "+String(err&&err.message||err));
    if(cached){S.bootFail=true;R();return}
    document.getElementById("app").innerHTML=
      '<div class="hd"><img class="logo" src="https://casapapelillo.com/wp-content/uploads/2026/04/cropped-logo-scaled-1-192x192.png" alt="Casa Papelillo" width="48" height="48" onerror="this.remove()"><h1>'+t("h1")+' <span>Casa Papelillo</span></h1></div>'+
      '<div class="calm" role="status">'+MSG.cal+'</div>'+
      '<div class="nav"><div class="spacer"></div><button class="bp" onclick="window.location.reload()">'+MSG.again+'</button></div>'+
      '<p class="help">'+MSG.help+'</p>';
  });
}

if(PREFETCH){
  fetchBootOnce(PREFETCH_STOP_MS).then(function(cfg){if(cfg&&cfg.success===true&&cfg.stripeMode===EXPECTED_STRIPE_MODE)bootPut(cfg)}).catch(function(){});
  return;
}
loadBookingData();

/* Swipe guard (SPAN3). A swipe that starts on the calendar must never pick a date.
   If the finger moved, drop the click the phone sends at the end of the swipe. */
(function(){
  var x=0,y=0,moved=false,last=0;
  document.addEventListener("touchstart",function(e){var t=e.touches[0];x=t.clientX;y=t.clientY;moved=false},{passive:true,capture:true});
  document.addEventListener("touchmove",function(e){var t=e.touches[0];if(Math.abs(t.clientX-x)>10||Math.abs(t.clientY-y)>10){moved=true;last=Date.now()}},{passive:true,capture:true});
  document.addEventListener("touchend",function(){if(moved)last=Date.now()},{passive:true,capture:true});
  document.addEventListener("click",function(e){
    var c=e.target&&e.target.closest&&e.target.closest(".cd");
    if(c&&moved&&Date.now()-last<400){e.preventDefault();e.stopPropagation()}
  },true);
})();

/* Frame height (R20). When the widget sits in an iframe, tell the host page its real
   content height after every change ("cp-widget:height"), and say when the step
   changes ("cp-widget:step") so the host can bring the top of the widget into view.
   The host page's listener (Elementor Custom Code, R20) does the resizing; without
   one nothing changes and the frame behaves exactly as before. The old "resize"
   message is still sent for any listener written against it. */
(function(){
  if(window.parent===window)return;
  var lastH=0,lastStep=S.step,queued=false;
  function measure(){
    var a=document.getElementById("app");
    return a?Math.ceil(a.getBoundingClientRect().bottom+(window.pageYOffset||0)):0;
  }
  /* Fixed frame (SPAN3). The page may hold the frame at a set height and ignore the
     height message. A taller widget then scrolls inside its frame, swipes bounce and
     date taps make it jump. If the frame stays away from the height sent, use the
     shorter touch layout so the content fits and swipes reach the page. Once only. */
  var fixed=false,fixTimer=0;
  function checkFixed(){
    var ih=window.innerHeight||0;
    if(fixed||!lastH||ih<1000||Math.abs(ih-lastH)<=40)return;
    fixed=true;
    document.body.classList.add("cp-fixed");
    lastH=0;queue();
  }
  function send(){
    queued=false;
    document.body.classList.toggle("cp-later",S.step>0);
    var h=measure();
    clearTimeout(fixTimer);fixTimer=setTimeout(checkFixed,900);
    if(h>0&&Math.abs(h-lastH)>1){
      lastH=h;
      try{
        window.parent.postMessage({type:"cp-widget:height",height:h,step:S.step},"*");
        window.parent.postMessage({type:"resize",height:h},"*");
      }catch(e){}
    }
    if(S.step!==lastStep){
      lastStep=S.step;
      try{window.parent.postMessage({type:"cp-widget:step",step:S.step},"*")}catch(e){}
    }
  }
  function queue(){if(!queued){queued=true;(window.requestAnimationFrame||setTimeout)(send)}}
  var app=document.getElementById("app");
  if(typeof ResizeObserver!=="undefined"&&app){try{new ResizeObserver(queue).observe(app)}catch(e){}}
  if(typeof MutationObserver!=="undefined"&&app){try{new MutationObserver(queue).observe(app,{childList:true,subtree:true})}catch(e){}}
  /* Late listeners (the page's height snippet can start after our first report): say the height again. */
  function resend(){lastH=0;queue()}
  window.addEventListener("load",function(){resend();[1000,2500,5000].forEach(function(t){setTimeout(resend,t)})});
  window.addEventListener("resize",queue);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(queue)}
  window.addEventListener("message",function(e){
    if(e.source===window.parent&&e.data&&e.data.type==="cp-host:ping"){lastH=0;queue()}
  });
  queue();
})();

});
